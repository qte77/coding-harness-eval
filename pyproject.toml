[project]
name = "coding-harness-eval"
version = "0.1.0"
description = "Hands-off harness to run CLI coding agents headless on identical specs and compare metrics"
requires-python = ">=3.13"
readme = "README.md"
license = "Apache-2.0"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
# Sibling git repo (import name `cc_recursive`); NOT in the dev group, so CI's
# `uv sync --group dev` never resolves it. Wired for real in the CC collector (#10).
# Spike: docs/research/spike-22-dependencies-2026-06.md
agents = ["cc-recursive-team-mode @ git+https://github.com/qte77/cc-recursive-team-mode"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.hatch.metadata]
allow-direct-references = true # required for the git-based `agents` optional dep

[dependency-groups]
dev = [
    "scriv[toml]>=1.8",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
    "complexipy>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S"] # S = flake8-bandit (security)
ignore = []

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = ["e2e: end-to-end tests (excluded from default run)"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 70

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15

[tool.bumpversion] # dispatch-only workflow; minimal to avoid missing-file refs
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
allow_dirty = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/harness/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.scriv]
format = "md"
fragment_directory = "changelog.d"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
md_header_level = "2"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
md_html_anchors = false
