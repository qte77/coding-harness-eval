---
# Grouped weekly updates, one PR per ecosystem. `uv` tracks pyproject.toml + uv.lock
# (the `pip` ecosystem does not read uv.lock); `github-actions` keeps the SHA pins in
# .github/workflows/ current.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
...
