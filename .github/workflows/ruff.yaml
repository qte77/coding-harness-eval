name: ruff
permissions:
  contents: read
on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      # Use Python version from pyproject.toml to prevent version divergence
      # Workflow cache prevents long load times after initial setup
      - run: uv python install
      - run: uv sync --group dev
      - run: make ruff